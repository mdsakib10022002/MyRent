# Project-wide Gradle settings.

# Increase heap size to 3GB. We remove MaxMetaspaceSize to prevent 
# "Metaspace overflow" crashes which are common in Compose/Firebase projects.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Run the Kotlin compiler inside the Gradle process.
# This prevents the "Kotlin compile daemon is ready" separate process from starting,
# which is the most common cause of this specific Error Code: 0 crash.
kotlin.compiler.execution.strategy=in-process

# Disable File System Watching which can cause locks and crashes on Windows.
org.gradle.vfs.watch=false

# Standard Android and Kotlin settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
